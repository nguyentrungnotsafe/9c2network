<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9c2network.io.vn</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --border-color: #262626;
            --text-color: #ffffff;
            --text-sub: #a8a8a8;
            --messenger-blue: #0084ff;
            --chat-recv-bg: #242526;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 60px; }

        header { position: sticky; top: 0; z-index: 100; background: var(--bg-color); border-bottom: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; font-weight: 900; }

        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-color); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: var(--text-sub); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
        .nav-item.active { color: var(--text-color); font-weight: bold; }

        .container { padding: 12px; max-width: 600px; margin: 0 auto; }
        .page { display: none; }
        .page.active { display: block; }

        input, textarea, button, select { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 10px; outline: none; }
        button { background: #ffffff; color: #000000; font-weight: bold; border: none; cursor: pointer; }
        button:active { opacity: 0.8; }
        button.btn-outline { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
        button.btn-danger { background: #ff4444; color: #fff; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 12px; }

        .profile-header { position: relative; margin-bottom: 40px; }
        .cover-img { width: 100%; height: 130px; background: #222; object-fit: cover; border-radius: 8px 8px 0 0; }
        .avatar-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--bg-color); position: absolute; bottom: -30px; left: 16px; background: #444; object-fit: cover; }
        .profile-info { margin-top: 35px; padding: 0 8px; }
        .field-label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; display: block; }

        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .post-media-container { width: 100%; margin: 8px 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .post-media-container img, .post-media-container video { width: 100%; display: block; max-height: 400px; object-fit: contain; background: #000; }
        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 8px; font-size: 0.85rem; color: var(--text-sub); }

        .messenger-container { display: flex; flex-direction: column; height: calc(100vh - 140px); background: #000; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        .chat-topbar { background: #121212; padding: 10px 14px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-user-input { background: #1f1f1f; border: none; padding: 6px 12px; margin-bottom: 0; width: 60%; border-radius: 20px; font-size: 0.85rem; color: #fff; }
        .chat-call-btns { display: flex; gap: 8px; }
        .icon-btn { width: 34px; height: 34px; border-radius: 50%; background: #262626; display: flex; align-items: center; justify-content: center; border: none; font-size: 0.9rem; margin: 0; }

        .chat-messages-area { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #000; }
        .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
        .msg-row.sent { margin-left: auto; flex-direction: row-reverse; }
        .msg-row.received { margin-right: auto; }
        .msg-bubble-msg { padding: 9px 14px; border-radius: 18px; font-size: 0.9rem; line-height: 1.35; word-break: break-word; }
        .msg-row.sent .msg-bubble-msg { background: var(--messenger-blue); color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.received .msg-bubble-msg { background: var(--chat-recv-bg); color: #fff; border-bottom-left-radius: 4px; }

        .chat-bottombar { background: #121212; padding: 8px 10px; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }
        .chat-bottombar input[type="text"] { background: #1f1f1f; border: none; margin-bottom: 0; border-radius: 20px; padding: 10px 14px; font-size: 0.9rem; }
        .btn-send-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--messenger-blue); border: none; color: #fff; font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 0; }
    </style>
</head>
<body>

    <!-- AUTH -->
    <div id="page-auth" class="container" style="margin-top: 40px;">
        <h1 style="text-align: center; margin-bottom: 20px; font-size: 2rem;">9c2network</h1>
        <div class="card">
            <input type="text" id="auth-username" placeholder="Tên người dùng">
            <input type="password" id="auth-password" placeholder="Mật khẩu">
            <button id="btn-login">Đăng Nhập</button>
            <button id="btn-register" class="btn-outline">Đăng Ký Tài Khoản Mới</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-structure" style="display: none;">
        <header>
            <h1>9c2network</h1>
            <span id="hdr-username" style="font-size: 0.85rem; color: var(--text-sub);"></span>
        </header>

        <!-- BẢNG TIN -->
        <div id="page-feed" class="page container active">
            <div class="card">
                <input type="text" id="post-title" placeholder="Tiêu đề bài đăng...">
                <textarea id="post-content" rows="2" placeholder="Bạn đang nghĩ gì?"></textarea>
                <input type="text" id="post-media-url" placeholder="Nhập Link Ảnh/Video (URL)...">
                <input type="file" id="post-media-file" accept="image/*,video/*">
                <select id="post-type">
                    <option value="image">Hình ảnh</option>
                    <option value="video">Video</option>
                    <option value="text">Chỉ chữ (Text)</option>
                </select>
                <button id="btn-create-post">Đăng Bài</button>
            </div>
            <div id="feed-list">Đang tải bài viết...</div>
        </div>

        <!-- TÌM KIẾM -->
        <div id="page-friends" class="page container">
            <div class="card">
                <input type="text" id="search-input" placeholder="Nhập tên người dùng...">
                <button id="btn-search" class="btn-outline">Tìm Kiếm</button>
            </div>
            <div id="search-results"></div>
        </div>

        <!-- TIN NHẮN -->
        <div id="page-messages" class="page container" style="padding: 6px;">
            <div class="messenger-container">
                <div class="chat-topbar">
                    <input type="text" id="msg-receiver" class="chat-user-input" placeholder="Nhập tên người nhận...">
                    <div class="chat-call-btns">
                        <button class="icon-btn">📞</button>
                        <button class="icon-btn">📹</button>
                    </div>
                </div>
                <div id="chat-box" class="chat-messages-area">
                    <p style="text-align: center; color: var(--text-sub); font-size: 0.8rem; margin-top: 20px;">Nhập tên bạn bè ở trên để nhắn tin</p>
                </div>
                <div class="chat-bottombar">
                    <label for="msg-file-input" class="icon-btn" style="cursor: pointer;">📷</label>
                    <input type="file" id="msg-file-input" accept="image/*" style="display: none;">
                    <input type="text" id="msg-input" placeholder="Tin nhắn...">
                    <button id="btn-send-msg" class="btn-send-icon">➔</button>
                </div>
            </div>
        </div>

        <!-- TRANG CÁ NHÂN -->
        <div id="page-profile" class="page container">
            <div class="card" style="padding: 0; overflow: hidden;">
                <div class="profile-header">
                    <img id="profile-cover" class="cover-img" src="https://via.placeholder.com/600x200/222/fff?text=Cover">
                    <img id="profile-avatar" class="avatar-img" src="https://via.placeholder.com/150/444/fff?text=Avatar">
                </div>
                <div class="profile-info">
                    <h2 id="profile-name">User</h2>
                    <br>
                    <label class="field-label">Tên hiển thị mới:</label>
                    <input type="text" id="edit-name" placeholder="Tên hiển thị">

                    <label class="field-label">Avatar (Chọn từ máy hoặc dán URL):</label>
                    <input type="file" id="edit-avatar-file" accept="image/*">
                    <input type="text" id="edit-avatar-url" placeholder="Hoặc dán Link Avatar URL...">

                    <label class="field-label">Ảnh bìa (Chọn từ máy hoặc dán URL):</label>
                    <input type="file" id="edit-cover-file" accept="image/*">
                    <input type="text" id="edit-cover-url" placeholder="Hoặc dán Link Ảnh bìa URL...">

                    <button id="btn-save-profile" class="btn-outline" style="margin-bottom: 15px;">Lưu Thay Đổi</button>
                    <button id="btn-logout" class="btn-danger">Đăng Xuất</button>
                </div>
            </div>
            <h3 style="margin: 15px 0 10px 0;">Bài viết của bạn</h3>
            <div id="profile-posts"></div>
        </div>

        <nav class="nav-bottom">
            <div class="nav-item active" onclick="switchTab('feed', this)">🏠<span>Bảng tin</span></div>
            <div class="nav-item" onclick="switchTab('friends', this)">🔍<span>Kết bạn</span></div>
            <div class="nav-item" onclick="switchTab('messages', this)">💬<span>Tin nhắn</span></div>
            <div class="nav-item" onclick="switchTab('profile', this)">👤<span>Cá nhân</span></div>
        </nav>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey : "AIzaSyDYMDR5k9x9LwSs2GCjVyLJWNEUCnXXiJU" , 
            authDomain : "c2network.firebaseapp.com" , 
            projectId : "c2network" , 
            storageBucket : "c2network.firebasestorage.app" , 
            messagingSenderId : "585950296404" , 
            appId : "1:585950296404:web:10bfa0bc3c4204eb2c70c1" , 
            measurementId : "G-YSW54YGNXY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        window.switchTab = function(pageName, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            element.classList.add('active');
            if(pageName === 'profile') loadProfilePosts();
        }

        const formatEmail = (user) => `${user.toLowerCase().trim()}@9c2network.io.vn`;

        const readFileAsBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        };

        // AUTH
        document.getElementById('btn-register').onclick = async () => {
            const user = document.getElementById('auth-username').value;
            const pass = document.getElementById('auth-password').value;
            if(!user || !pass) return alert("Vui lòng nhập Username và Password");
            try {
                const res = await createUserWithEmailAndPassword(auth, formatEmail(user), pass);
                await addDoc(collection(db, "users"), {
                    uid: res.user.uid,
                    username: user,
                    displayName: user,
                    avatar: 'https://via.placeholder.com/150/444/fff?text=' + user[0].toUpperCase(),
                    cover: 'https://via.placeholder.com/600x200/222/fff?text=9c2network'
                });
                alert("Đăng ký thành công!");
            } catch (err) { alert("Lỗi: " + err.message); }
        };

        document.getElementById('btn-login').onclick = async () => {
            const user = document.getElementById('auth-username').value;
            const pass = document.getElementById('auth-password').value;
            try { await signInWithEmailAndPassword(auth, formatEmail(user), pass); } 
            catch (err) { alert("Lỗi đăng nhập: " + err.message); }
        };

        document.getElementById('btn-logout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const q = query(collection(db, "users"), where("uid", "==", user.uid));
                const snap = await getDocs(q);
                snap.forEach(docSnap => currentUserData = { id: docSnap.id, ...docSnap.data() });

                document.getElementById('page-auth').style.display = 'none';
                document.getElementById('app-structure').style.display = 'block';
                document.getElementById('hdr-username').innerText = `@${currentUserData.username}`;
                
                loadProfileUI();
                listenFeed();
            } else {
                document.getElementById('page-auth').style.display = 'block';
                document.getElementById('app-structure').style.display = 'none';
            }
        });

        // ĐĂNG BÀI VIẾT
        document.getElementById('btn-create-post').onclick = async () => {
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const urlMedia = document.getElementById('post-media-url').value;
            const fileMedia = document.getElementById('post-media-file').files[0];
            const type = document.getElementById('post-type').value;

            if(!content && !urlMedia && !fileMedia) return alert("Vui lòng nhập nội dung hoặc chọn File!");

            const btn = document.getElementById('btn-create-post');
            btn.innerText = "Đang đăng...";
            btn.disabled = true;

            try {
                let mediaSrc = urlMedia;
                if (fileMedia) {
                    if (fileMedia.size > 10 * 1024 * 1024) {
                        btn.innerText = "Đăng Bài";
                        btn.disabled = false;
                        return alert("File quá lớn! Vui lòng chọn file dưới 10MB hoặc dùng Link URL.");
                    }
                    mediaSrc = await readFileAsBase64(fileMedia);
                }

                await addDoc(collection(db, "posts"), {
                    author: currentUserData ? currentUserData.username : 'Ẩn danh',
                    title: title || '',
                    content: content || '',
                    media: mediaSrc || '',
                    type: type,
                    createdAt: serverTimestamp()
                });

                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
                document.getElementById('post-media-url').value = '';
                document.getElementById('post-media-file').value = '';
                alert("Đăng bài thành công!");
            } catch (err) {
                alert("Lỗi khi đăng bài: " + err.message);
            } finally {
                btn.innerText = "Đăng Bài";
                btn.disabled = false;
            }
        };

        // BẢNG TIN REALTIME
        function listenFeed() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('feed-list');
                feed.innerHTML = '';
                if(snapshot.empty) {
                    feed.innerHTML = '<p style="text-align:center; color:var(--text-sub);">Chưa có bài viết nào.</p>';
                    return;
                }
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    let mediaHtml = '';
                    if(p.media) {
                        if(p.type === 'image' || p.media.startsWith('data:image')) mediaHtml = `<div class="post-media-container"><img src="${p.media}"></div>`;
                        else if(p.type === 'video' || p.media.startsWith('data:video')) mediaHtml = `<div class="post-media-container"><video src="${p.media}" controls></video></div>`;
                    }
                    feed.innerHTML += `
                        <div class="card">
                            <div class="post-header"><strong>@${p.author}</strong></div>
                            ${p.title ? `<h4>${p.title}</h4>` : ''}
                            ${p.content ? `<p>${p.content}</p>` : ''}
                            ${mediaHtml}
                            <div class="post-actions"><span>👍 Thích</span><span>💬 Bình luận</span></div>
                        </div>
                    `;
                });
            });
        }

        // CẬP NHẬT PROFILE (CHỌN FILE ẢNH VÀ ĐỔI AVATAR / BÌA)
        document.getElementById('btn-save-profile').onclick = async () => {
            const newName = document.getElementById('edit-name').value;
            const avatarUrl = document.getElementById('edit-avatar-url').value;
            const avatarFile = document.getElementById('edit-avatar-file').files[0];
            const coverUrl = document.getElementById('edit-cover-url').value;
            const coverFile = document.getElementById('edit-cover-file').files[0];

            const btn = document.getElementById('btn-save-profile');
            btn.innerText = "Đang lưu...";
            btn.disabled = true;

            try {
                let updatedData = {};

                if (newName) updatedData.displayName = newName;

                // Xử lý Avatar
                if (avatarFile) {
                    updatedData.avatar = await readFileAsBase64(avatarFile);
                } else if (avatarUrl) {
                    updatedData.avatar = avatarUrl;
                }

                // Xử lý Ảnh Bìa
                if (coverFile) {
                    updatedData.cover = await readFileAsBase64(coverFile);
                } else if (coverUrl) {
                    updatedData.cover = coverUrl;
                }

                if (Object.keys(updatedData).length === 0) {
                    btn.innerText = "Lưu Thay Đổi";
                    btn.disabled = false;
                    return alert("Bạn chưa nhập thông tin nào để thay đổi!");
                }

                const userRef = doc(db, "users", currentUserData.id);
                await updateDoc(userRef, updatedData);

                // Cập nhật giao diện lập tức
                currentUserData = { ...currentUserData, ...updatedData };
                loadProfileUI();

                document.getElementById('edit-name').value = '';
                document.getElementById('edit-avatar-url').value = '';
                document.getElementById('edit-avatar-file').value = '';
                document.getElementById('edit-cover-url').value = '';
                document.getElementById('edit-cover-file').value = '';

                alert("Cập nhật thông tin thành công!");
            } catch (err) {
                alert("Lỗi khi lưu thông tin: " + err.message);
            } finally {
                btn.innerText = "Lưu Thay Đổi";
                btn.disabled = false;
            }
        };

        function loadProfileUI() {
            document.getElementById('profile-name').innerText = currentUserData.displayName || currentUserData.username;
            document.getElementById('profile-avatar').src = currentUserData.avatar;
            document.getElementById('profile-cover').src = currentUserData.cover;
        }

        async function loadProfilePosts() {
            const q = query(collection(db, "posts"), where("author", "==", currentUserData.username));
            const snap = await getDocs(q);
            const container = document.getElementById('profile-posts');
            container.innerHTML = '';
            snap.forEach(docSnap => {
                const p = docSnap.data();
                container.innerHTML += `<div class="card"><p>${p.content}</p></div>`;
            });
        }
    </script>
</body>
</html>
