<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9c2network - Mạng Xã Hội Tối Giản</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #000000; --bg-card: #0f0f0f; --bg-input: #1a1a1a;
            --border-color: #333333; --text-primary: #ffffff; --text-secondary: #aaaaaa;
            --accent-white: #ffffff; --accent-black: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); -webkit-tap-highlight-color: transparent; padding-bottom: 60px; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg-main); } ::-webkit-scrollbar-thumb { background: var(--border-color); }

        button { cursor: pointer; border: 1px solid var(--border-color); background: var(--accent-black); color: var(--text-primary); padding: 10px 16px; border-radius: 6px; font-weight: 600; transition: 0.2s; }
        button:hover { background: var(--accent-white); color: var(--accent-black); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input, textarea, select { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px; border-radius: 6px; outline: none; width: 100%; margin-bottom: 10px; }
        input[type="file"] { padding: 8px; color: var(--text-secondary); cursor: pointer; }
        input[type="file"]::file-selector-button { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 10px; }

        #auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 30px; width: 100%; max-width: 400px; border-radius: 12px; text-align: center; }
        .auth-box h1 { font-size: 1.8rem; margin-bottom: 5px; } .auth-box p { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 25px; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .auth-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--text-secondary); }
        .auth-tab.active { color: var(--text-primary); border-bottom: 2px solid var(--text-primary); }

        #app-container { display: none; flex-direction: column; min-height: 100vh; }
        header { background: var(--bg-main); border-bottom: 1px solid var(--border-color); padding: 12px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.2rem; color: #fff; text-decoration: none; }
        
        .main-content { max-width: 600px; margin: 0 auto; width: 100%; padding: 15px; }
        .page { display: none; animation: fadeIn 0.2s ease-in-out; } .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-main); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 0.75rem; border: none; background: none; padding: 5px 15px; }
        .nav-item.active { color: var(--text-primary); }
        .nav-item i { font-size: 1.2rem; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .user-info-sm { display: flex; align-items: center; gap: 10px; }
        .avatar-sm { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); background: #222; }
        .post-media-box { width: 100%; border: 1px solid var(--border-color); border-radius: 6px; background: #000; margin: 10px 0; overflow: hidden; display: flex; justify-content: center; min-height: 200px; align-items: center; }
        .post-media-box img, .post-media-box video { width: 100%; max-height: 450px; object-fit: contain; }
        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px; }
        .action-btn { background: none; border: none; color: var(--text-secondary); font-size: 0.9rem; flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; padding: 6px; border-radius: 4px; }
        .action-btn:hover { background: rgba(255,255,255,0.05); }
        .action-btn.liked { color: #ff4444; font-weight: bold; }
        .delete-btn { background: none; border: none; color: #ff4444; font-size: 0.85rem; padding: 5px 8px; border-radius: 4px; }
        .delete-btn:hover { background: rgba(255,68,68,0.1); }

        .comment-section { margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .comment-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 0.9rem; align-items: flex-start; }
        .comment-item img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #222; }
        .comment-box { background: var(--bg-input); padding: 8px 12px; border-radius: 12px; flex: 1; }

        .profile-header-card { padding: 0; overflow: hidden; }
        .cover-photo { width: 100%; height: 160px; object-fit: cover; background: #222; }
        .profile-details { padding: 15px; position: relative; }
        .avatar-large { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--bg-card); object-fit: cover; position: absolute; top: -45px; left: 15px; background: #111; }
        .profile-actions { display: flex; justify-content: flex-end; margin-bottom: 10px; }

        .chat-layout { height: calc(100vh - 140px); display: flex; flex-direction: column; border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; background: var(--bg-card); }
        .chat-list-view { flex: 1; overflow-y: auto; }
        .chat-user-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .chat-user-item:hover { background: #161616; }
        .chat-room-view { display: none; flex-direction: column; height: 100%; }
        .chat-room-header { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; background: var(--bg-main); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #080808; }

        /* CSS cho tính năng Cuộc gọi âm thanh & Video */
        .call-hdr-btn { background: none; border: none; color: var(--text-primary); font-size: 1.1rem; padding: 6px 10px; border-radius: 6px; }
        .call-hdr-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        
        .call-card { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; }
        .incoming-ring-avatar { position: relative; margin-bottom: 10px; }
        .incoming-ring-avatar .avatar-large { position: static; width: 100px; height: 100px; animation: pulseRing 1.5s infinite; }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .call-actions-row { display: flex; gap: 20px; width: 100%; justify-content: center; margin-top: 15px; }
        .btn-call-accept { background: #2e7d32; color: #fff; border: none; padding: 12px 24px; border-radius: 30px; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .btn-call-accept:hover { background: #1b5e20; color: #fff; }
        .btn-call-decline { background: #c62828; color: #fff; border: none; padding: 12px 24px; border-radius: 30px; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .btn-call-decline:hover { background: #b71c1c; color: #fff; }

        .call-screen-container { width: 100%; max-width: 600px; background: #000; border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; height: 80vh; position: relative; }
        .video-container { flex: 1; position: relative; background: #080808; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        .local-pip-video { position: absolute; top: 15px; right: 15px; width: 110px; height: 150px; border-radius: 10px; object-fit: cover; border: 2px solid var(--border-color); background: #1a1a1a; z-index: 10; }
        
        .audio-avatar-box { display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; text-align: center; }
        .audio-avatar-box img { position: static; width: 110px; height: 110px; margin-bottom: 12px; }

        .call-status-bar { padding: 8px; text-align: center; background: rgba(0,0,0,0.6); font-size: 0.85rem; color: var(--text-secondary); }
        .active-call-controls { display: flex; justify-content: center; gap: 20px; padding: 20px; background: var(--bg-card); border-top: 1px solid var(--border-color); }
        .call-control-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; padding: 0; background: var(--bg-input); }
        .call-control-btn.active-off { background: #ff4444; color: #fff; }
        .btn-end-call { background: #c62828; color: #fff; border: none; }
        .btn-end-call:hover { background: #b71c1c; color: #fff; }

        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; word-break: break-word; line-height: 1.4; animation: popIn 0.15s ease-out; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .msg-bubble.sent { align-self: flex-end; background: var(--accent-white); color: var(--accent-black); border-bottom-right-radius: 4px; }
        .msg-bubble.received { align-self: flex-start; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
        .msg-bubble.sending { opacity: 0.7; }
        .chat-input-area { padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--border-color); background: var(--bg-main); align-items: center; }
        .chat-input-area input[type="text"] { margin-bottom: 0; border-radius: 20px; padding: 10px 15px; }

        #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #fff; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 450px; padding: 20px; }

        /* Notification Toast */
        #toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ffffff; color: #000000; padding: 10px 20px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; z-index: 10000; box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Đang xử lý...</p>
    </div>

    <div id="toast">Thông báo</div>

    <div id="auth-container">
        <div class="auth-box">
            <h1>9C2NETWORK</h1>
            <p>Monochromatic Social App</p>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="toggleAuth('login')">Đăng nhập</button>
                <button class="auth-tab" onclick="toggleAuth('register')">Đăng ký</button>
            </div>
            
            <form id="login-form" onsubmit="handleAuth(event, 'login')">
                <input type="text" id="login-user" placeholder="Tên đăng nhập" required>
                <input type="password" id="login-pass" placeholder="Mật khẩu" required>
                <button type="submit" style="width: 100%;">Đăng Nhập</button>
            </form>

            <form id="register-form" style="display: none;" onsubmit="handleAuth(event, 'register')">
                <input type="text" id="reg-name" placeholder="Tên hiển thị" required>
                <input type="text" id="reg-user" placeholder="Tên đăng nhập (viết liền, không dấu)" required>
                <input type="password" id="reg-pass" placeholder="Mật khẩu" required>
                <button type="submit" style="width: 100%;">Tạo Tài Khoản</button>
            </form>
        </div>
    </div>

    <div id="app-container">
        <header>
            <a href="#" class="logo">9c2network</a>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="header-username" style="font-size: 0.9rem; color: var(--text-secondary);"></span>
                <i class="fa-solid fa-right-from-bracket" onclick="handleLogout()" style="cursor: pointer; font-size: 1.2rem;" title="Đăng xuất"></i>
            </div>
        </header>

        <main class="main-content">
            <div id="page-feed" class="page active">
                <div class="card">
                    <h3 style="font-size: 1rem; margin-bottom: 10px;"><i class="fa-solid fa-pen"></i> Tạo bài viết</h3>
                    <input type="text" id="post-title" placeholder="Tiêu đề (không bắt buộc)...">
                    <textarea id="post-content" rows="3" placeholder="Nội dung bài viết..."></textarea>
                    
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">Đính kèm Ảnh / Video (đã tự động nén siêu tốc):</label>
                    <input type="file" id="post-file" accept="image/*,video/*">
                    
                    <button onclick="createPost()" style="width: 100%; margin-top: 5px;">Đăng Bài</button>
                </div>
                <div id="feed-list"></div>
            </div>

            <div id="page-friends" class="page">
                <div class="card">
                    <input type="text" id="search-input" placeholder="Nhập tên người dùng cần tìm..." oninput="searchUsers()">
                </div>
                <div id="search-results" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
            </div>

            <div id="page-messages" class="page">
                <div class="chat-layout">
                    <div class="chat-list-view" id="chat-list"></div>
                    
                    <div class="chat-room-view" id="chat-room">
                        <div class="chat-room-header">
                            <i class="fa-solid fa-chevron-left" onclick="closeChatRoom()" style="cursor: pointer; padding: 5px; font-size: 1.1rem;"></i>
                            <img id="chat-active-avatar" src="" class="avatar-sm">
                            <strong id="chat-active-name">--</strong>
                            <div style="margin-left: auto; display: flex; gap: 8px;">
                                <button class="call-hdr-btn" onclick="initiateCall('audio')" title="Gọi thoại"><i class="fa-solid fa-phone"></i></button>
                                <button class="call-hdr-btn" onclick="initiateCall('video')" title="Gọi video"><i class="fa-solid fa-video"></i></button>
                            </div>
                        </div>
                        <div class="chat-messages" id="chat-messages-box"></div>
                        <div class="chat-input-area">
                            <label for="chat-file" style="cursor: pointer; font-size: 1.2rem; padding: 5px;"><i class="fa-solid fa-image"></i></label>
                            <input type="file" id="chat-file" accept="image/*,video/*" style="display: none;" onchange="sendChatFile(this)">
                            <input type="text" id="chat-text" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendChatText()">
                            <button onclick="sendChatText()" style="padding: 10px 15px; border-radius: 20px;"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="page-profile" class="page">
                <div class="card profile-header-card">
                    <img id="profile-cover" src="" class="cover-photo">
                    <div class="profile-details">
                        <img id="profile-avatar" src="" class="avatar-large">
                        <div class="profile-actions">
                            <button onclick="document.getElementById('modal-edit-profile').style.display='flex'"><i class="fa-solid fa-pen"></i> Chỉnh sửa</button>
                        </div>
                        <h2 id="profile-name" style="margin-top: 10px;">--</h2>
                        <p id="profile-handle" style="color: var(--text-secondary); font-size: 0.9rem;">@--</p>
                        <p id="profile-bio" style="margin-top: 10px; font-size: 0.95rem;">--</p>
                    </div>
                </div>
                <h3 style="margin: 20px 0 10px;"><i class="fa-solid fa-images"></i> Bài viết của bạn</h3>
                <div id="profile-posts-list"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchPage('feed', this)"><i class="fa-solid fa-house"></i> Bảng tin</button>
            <button class="nav-item" onclick="switchPage('friends', this)"><i class="fa-solid fa-magnifying-glass"></i> Tìm bạn</button>
            <button class="nav-item" onclick="switchPage('messages', this)"><i class="fa-solid fa-message"></i> Tin nhắn</button>
            <button class="nav-item" onclick="switchPage('profile', this)"><i class="fa-solid fa-user"></i> Hồ sơ</button>
        </nav>
    </div>

    <!-- Incoming Call Ringing Modal -->
    <div id="incoming-call-modal" class="modal">
        <div class="modal-content call-card">
            <div class="incoming-ring-avatar">
                <img id="incoming-caller-avatar" src="https://ui-avatars.com/api/?name=User" class="avatar-large">
            </div>
            <h3 id="incoming-caller-name" style="margin-top: 10px;">--</h3>
            <p id="incoming-call-type" style="color: var(--text-secondary); margin-bottom: 20px; font-size:0.9rem;">Đang gọi cho bạn...</p>
            <div class="call-actions-row">
                <button onclick="declineIncomingCall()" class="btn-call-decline"><i class="fa-solid fa-phone-slash"></i> Từ chối</button>
                <button onclick="acceptIncomingCall()" class="btn-call-accept"><i class="fa-solid fa-phone"></i> Trả lời</button>
            </div>
        </div>
    </div>

    <!-- Active Ongoing Call Screen Modal -->
    <div id="active-call-modal" class="modal">
        <div class="call-screen-container">
            <div class="video-container">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted class="local-pip-video"></video>
                <div id="audio-call-avatar-placeholder" class="audio-avatar-box">
                    <img id="active-call-user-avatar" src="https://ui-avatars.com/api/?name=User" class="avatar-large">
                    <h3 id="active-call-user-name" style="margin-top:10px;">--</h3>
                </div>
            </div>
            <div class="call-status-bar" id="call-status-text">Đang kết nối...</div>
            <div class="active-call-controls">
                <button id="btn-toggle-mic" onclick="toggleAudioMute()" class="call-control-btn" title="Bật/Tắt Mic"><i class="fa-solid fa-microphone"></i></button>
                <button id="btn-toggle-cam" onclick="toggleVideoMute()" class="call-control-btn" title="Bật/Tắt Camera"><i class="fa-solid fa-video"></i></button>
                <button onclick="endCall()" class="call-control-btn btn-end-call" title="Kết thúc cuộc gọi"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="modal-confirm-delete" class="modal">
        <div class="modal-content" style="text-align: center; max-width: 350px;">
            <h3 style="margin-bottom: 15px; color: #ff4444;"><i class="fa-solid fa-triangle-exclamation"></i> Xóa bài viết?</h3>
            <p style="font-size: 0.9rem; margin-bottom: 20px; color: var(--text-secondary);">Hành động này không thể hoàn tác. Bạn có chắc chắn muốn xóa bài viết này không?</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="closeDeleteModal()" style="flex: 1; background: var(--bg-input); border-color: var(--border-color);">Hủy</button>
                <button onclick="executeDeletePost()" style="flex: 1; background: #c62828; color: #fff; border: none;">Xóa</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="modal-edit-profile" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 15px;">Chỉnh sửa Hồ Sơ</h2>
            <label>Tên hiển thị:</label>
            <input type="text" id="edit-name">
            <label>Tiểu sử:</label>
            <textarea id="edit-bio" rows="2"></textarea>
            
            <label>Đổi Ảnh đại diện:</label>
            <input type="file" id="edit-avatar-file" accept="image/*">
            
            <label>Đổi Ảnh bìa:</label>
            <input type="file" id="edit-cover-file" accept="image/*">
            
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                <button onclick="document.getElementById('modal-edit-profile').style.display='none'">Hủy</button>
                <button onclick="saveProfile()">Lưu Thay Đổi</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, query, where, onSnapshot, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = { 
            apiKey : "AIzaSyDYMDR5k9x9LwSs2GCjVyLJWNEUCnXXiJU", 
            authDomain : "c2network.firebaseapp.com", 
            projectId : "c2network", 
            storageBucket : "c2network.firebasestorage.app", 
            messagingSenderId : "585950296404", 
            appId : "1:585950296404:web:10bfa0bc3c4204eb2c70c1", 
            measurementId : "G-YSW54YGNXY"
        };

        // Trình phát nhạc chuông gọi điện bằng Web Audio API
        function playRingtone() {
            stopRingtone();
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();
                
                const playTone = () => {
                    if (!audioContext || audioContext.state === 'closed') return;
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(480, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.4);
                    
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
                    
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.6);
                };

                playTone();
                ringtoneTimer = setInterval(playTone, 1400);
            } catch (e) {
                console.warn("Ringtone audio warning:", e);
            }
        }

        function stopRingtone() {
            if (ringtoneTimer) {

        const timeAgo = (timestamp) => {
            if (!timestamp) return 'Vừa xong';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Vừa xong';
            if (seconds < 3600) return Math.floor(seconds/60) + ' phút trước';
            if (seconds < 86400) return Math.floor(seconds/3600) + ' giờ trước';
            return Math.floor(seconds/86400) + ' ngày trước';
        };

        async function compressImageToDataUrl(file, maxWidth = 900, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(e.target.result);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        async function fileToDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        async function compressImage(file, maxWidth = 1080, quality = 0.75) {
            if (!file || !file.type.startsWith('image/')) return file;
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (!blob) { resolve(file); return; }
                            const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });
                            resolve(compressedFile);
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = () => resolve(file);
                };
                reader.onerror = () => resolve(file);
            });
        }

        async function uploadFileToStorage(file, folder) {
            if (!file) return null;
            try {
                // Thử tải lên Firebase Storage trực tiếp
                const sanitizeName = file.name ? file.name.replace(/[^a-zA-Z0-9.-]/g, '_') : 'file';
                const fileRef = ref(storage, `${folder}/${Date.now()}_${Math.random().toString(36).substring(2, 7)}_${sanitizeName}`);
                await uploadBytes(fileRef, file);
                return await getDownloadURL(fileRef);
            } catch (storageError) {
                console.warn("Firebase Storage không khả dụng, đang kích hoạt cơ chế dự phòng siêu tốc:", storageError);
                // Cơ chế tự động dự phòng khi gặp lỗi kết nối/CORS/quyền truy cập Firebase Storage
                if (file.type.startsWith('image/')) {
                    return await compressImageToDataUrl(file, 850, 0.7);
                } else if (file.type.startsWith('video/')) {
                    if (file.size <= 2 * 1024 * 1024) {
                        return await fileToDataURL(file);
                    } else {
                        showToast("Lưu ý: Video kích thước lớn được phát từ bộ nhớ tạm.");
                        return URL.createObjectURL(file);
                    }
                } else {
                    return await fileToDataURL(file);
                }
            }
        }

        // Lắng nghe thông báo cuộc gọi tới cho User đang đăng nhập
        function listenIncomingCalls() {
            if (!auth.currentUser) return;
            if (unsubscribeIncomingCalls) unsubscribeIncomingCalls();

            const q = query(
                collection(db, "calls"), 
                where("receiverUid", "==", auth.currentUser.uid),
                where("status", "==", "calling")
            );

            unsubscribeIncomingCalls = onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const callData = { id: change.doc.id, ...change.doc.data() };
                        if (!currentCallId) {
                            pendingIncomingCallDoc = callData;
                            showIncomingCallModal(callData);
                        }
                    }
                });
            }, (err) => console.error("Incoming call listener error:", err));

        function showIncomingCallModal(data) {

            const unsubTemp = onSnapshot(callRef, (docSnap) => {

        // Khởi tạo cuộc gọi đi (Initiate Call)
        window.initiateCall = async (type) => {
            if (!currentUserDoc || !activeChatUserId) return showToast("Không tìm thấy thông tin đối phương!");
            const targetUser = usersCache[activeChatUserId];
            if (!targetUser) return showToast("Không tìm thấy thông tin người nhận!");

            showLoading("Đang khởi tạo kết nối...");
            try {
                // Tạo Media Stream local
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: type === 'video'
                });

                setupCallUI(type, targetUser.displayName || targetUser.username, targetUser.avatar);
                document.getElementById('call-status-text').innerText = "Đang đổ chuông...";
                playRingtone();

                peerConnection = new RTCPeerConnection(rtcConfiguration);
                remoteStream = new MediaStream();

                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
                };

                const remoteVideoEl = document.getElementById('remote-video');
                const localVideoEl = document.getElementById('local-video');
                remoteVideoEl.srcObject = remoteStream;
                localVideoEl.srcObject = localStream;

                // Tạo Call Document trên Firestore
                const callRef = doc(collection(db, "calls"));
                currentCallId = callRef.id;

                const callerCandidatesColl = collection(callRef, "callerCandidates");
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        addDoc(callerCandidatesColl, event.candidate.toJSON());
                    }
                };

                // Tạo WebRTC Offer
                const offerDescription = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offerDescription);

                const offer = {
                    sdp: offerDescription.sdp,
                    type: offerDescription.type
                };

                await setDoc(callRef, {
                    callerUid: currentUserDoc.uid,
                    callerName: currentUserDoc.displayName || currentUserDoc.username,
                    callerAvatar: currentUserDoc.avatar,
                    receiverUid: activeChatUserId,
                    receiverName: targetUser.displayName || targetUser.username,
                    receiverAvatar: targetUser.avatar,
                    type: type,
                    status: 'calling',
                    offer: offer,
                    createdAt: serverTimestamp()
                });

                // Theo dõi trạng thái cuộc gọi từ phía Receiver
                unsubscribeCallDoc = onSnapshot(callRef, async (snapshot) => {
                    const data = snapshot.data();
                    if (!data) return;

                    if (data.status === 'accepted' && data.answer && !peerConnection.currentRemoteDescription) {
                        stopRingtone();
                        document.getElementById('call-status-text').innerText = "Đã kết nối";
                        const answerDescription = new RTCSessionDescription(data.answer);
                        await peerConnection.setRemoteDescription(answerDescription);

                        // Lắng nghe ICE Candidates từ Receiver
                        const receiverCandidatesColl = collection(callRef, "receiverCandidates");
                        onSnapshot(receiverCandidatesColl, (snap) => {
                            snap.docChanges().forEach((change) => {
                                if (change.type === "added") {
                                    const candidate = new RTCIceCandidate(change.doc.data());
                                    peerConnection.addIceCandidate(candidate);
                                }
                            });
                        });
                    } else if (data.status === 'declined') {
                        stopRingtone();
                        showToast("Người nhận đã từ chối cuộc gọi.");
                        cleanupCall();
                    } else if (data.status === 'ended') {
                        stopRingtone();
                        showToast("Cuộc gọi đã kết thúc.");
                        cleanupCall();
                    }
                });

            } catch (err) {
                console.error("Initiate call error:", err);
                showToast("Không thể mở micro/camera: " + err.message);
                cleanupCall();
            }
            hideLoading();
        };

        // Trả lời cuộc gọi đến (Accept Incoming Call)
        window.acceptIncomingCall = async () => {
            if (!pendingIncomingCallDoc) return;
            const data = pendingIncomingCallDoc;
            stopRingtone();
            document.getElementById('incoming-call-modal').style.display = 'none';

            showLoading("Đang kết nối cuộc gọi...");
            try {
                currentCallId = data.id;
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: data.type === 'video'
                });

                setupCallUI(data.type, data.callerName, data.callerAvatar);
                document.getElementById('call-status-text').innerText = "Đã kết nối";

                peerConnection = new RTCPeerConnection(rtcConfiguration);
                remoteStream = new MediaStream();

                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
                };

                document.getElementById('remote-video').srcObject = remoteStream;
                document.getElementById('local-video').srcObject = localStream;

                const callRef = doc(db, "calls", currentCallId);
                const receiverCandidatesColl = collection(callRef, "receiverCandidates");
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        addDoc(receiverCandidatesColl, event.candidate.toJSON());
                    }
                };

                // Set Remote Offer từ Caller
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));

                // Tạo Answer
                const answerDescription = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answerDescription);

                const answer = {
                    type: answerDescription.type,
                    sdp: answerDescription.sdp
                };

                await updateDoc(callRef, {
                    answer: answer,
                    status: 'accepted'
                });

                // Lắng nghe ICE candidates từ Caller
                const callerCandidatesColl = collection(callRef, "callerCandidates");
                onSnapshot(callerCandidatesColl, (snap) => {
                    snap.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const candidate = new RTCIceCandidate(change.doc.data());
                            peerConnection.addIceCandidate(candidate);
                        }
                    });
                });

                // Lắng nghe nếu cuộc gọi bị dừng
                unsubscribeCallDoc = onSnapshot(callRef, (snapshot) => {
                    const st = snapshot.data()?.status;
                    if (st === 'ended') {
                        showToast("Cuộc gọi đã kết thúc.");
                        cleanupCall();
                    }
                });

            } catch (err) {
                console.error("Accept call error:", err);
                showToast("Lỗi kết nối cuộc gọi: " + err.message);
                cleanupCall();
            }
            hideLoading();
        };

        function cleanupCall() {
            stopRingtone();
            if (unsubscribeCallDoc) { unsubscribeCallDoc(); unsubscribeCallDoc = null; }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;

                peerConnection.close();

            currentCallId = null;

            isAudioMuted = false;

                await addDoc(collection(db, "posts"), {
                    authorUid: currentUserDoc.uid,
                    authorName: currentUserDoc.displayName || currentUserDoc.username,
                    authorUsername: currentUserDoc.username,
                    authorAvatar: currentUserDoc.avatar,
                    title: title,
                    content: content,
                    mediaUrl: mediaUrl,
                    mediaType: mediaType,
                    likes: [],
                    comments: [],
                    createdAt: serverTimestamp()
                });

                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
                fileInput.value = '';
                showToast("Đã đăng bài thành công!");
            } catch (error) {
                showToast("Lỗi đăng bài: " + error.message);
            }
            hideLoading();
        };

        let postToDeleteId = null;

        window.deletePost = (postId) => {
            postToDeleteId = postId;
            document.getElementById('modal-confirm-delete').style.display = 'flex';
        };

        window.closeDeleteModal = () => {
            postToDeleteId = null;
            document.getElementById('modal-confirm-delete').style.display = 'none';
        };

        window.executeDeletePost = async () => {
            if(!postToDeleteId) return;
            const postId = postToDeleteId;
            closeDeleteModal();
            
            showLoading("Đang xóa...");
            try {
                await deleteDoc(doc(db, "posts", postId));
                showToast("Đã xóa bài viết!");
            } catch(e) {
                showToast("Không thể xóa: " + e.message);
            }
            hideLoading();
        };

        function listenFeed() {
            const q = collection(db, "posts");
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('feed-list');
                list.innerHTML = '';
                
                let posts = [];
                snapshot.forEach(docSnap => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });

                posts.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return timeB - timeA;
                });

                posts.forEach(p => {
                    const currentUid = currentUserDoc ? currentUserDoc.uid : null;
                    const isLiked = currentUid && p.likes && Array.isArray(p.likes) && p.likes.includes(currentUid);
                    const isAuthor = currentUid && p.authorUid === currentUid;
                    const isOpen = expandedComments.has(p.id);
                    
                    let mediaHtml = '';
                    if (p.mediaUrl) {
                        mediaHtml = p.mediaType === 'video' 
                            ? `<div class="post-media-box"><video src="${p.mediaUrl}" controls preload="metadata"></video></div>`
                            : `<div class="post-media-box"><img src="${p.mediaUrl}" loading="lazy"></div>`;
                    }

                    let commentsHtml = (p.comments || []).map(c => `
                        <div class="comment-item">
                            <img src="${c.avatar || 'https://ui-avatars.com/api/?name=User'}" loading="lazy">
                            <div class="comment-box">
                                <strong style="font-size:0.85rem;">${escapeHtml(c.name)}</strong>
                                <p style="margin-top:2px; font-size:0.9rem;">${escapeHtml(c.text)}</p>
                            </div>
                        </div>
                    `).join('');

                    list.innerHTML += `
                        <div class="card">
                            <div class="post-header">
                                <div class="user-info-sm">
                                    <img src="${p.authorAvatar || 'https://ui-avatars.com/api/?name=User'}" class="avatar-sm" loading="lazy">
                                    <div>
                                        <strong>${escapeHtml(p.authorName || 'Ẩn danh')}</strong>
                                        <p style="font-size:0.75rem; color:var(--text-secondary);">@${escapeHtml(p.authorUsername || 'user')} • ${timeAgo(p.createdAt)}</p>
                                    </div>
                                </div>
                                ${isAuthor ? `<button class="delete-btn" onclick="deletePost('${p.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                            ${p.title ? `<h4 style="margin-bottom:5px;">${escapeHtml(p.title)}</h4>` : ''}
                            ${p.content ? `<p style="white-space: pre-wrap; font-size:0.95rem;">${escapeHtml(p.content)}</p>` : ''}
                            ${mediaHtml}
                            <div class="post-actions">
                                <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}', ${Boolean(isLiked)})">
                                    <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart"></i> ${p.likes ? p.likes.length : 0}
                                </button>
                                <button class="action-btn" onclick="toggleCommentSection('${p.id}')">
                                    <i class="fa-regular fa-comment"></i> ${p.comments ? p.comments.length : 0}
                                </button>
                            </div>
                            <div class="comment-section" id="comments-${p.id}" style="display: ${isOpen ? 'block' : 'none'};">
                                <div id="comments-list-${p.id}">${commentsHtml}</div>
                                <div style="display:flex; gap:10px; margin-top:10px;">
                                    <input type="text" id="comment-input-${p.id}" placeholder="Viết bình luận..." style="margin-bottom:0; flex:1;" onkeypress="if(event.key==='Enter') addComment('${p.id}')">
                                    <button onclick="addComment('${p.id}')" style="padding: 10px 15px;"><i class="fa-solid fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }, (err) => console.error("Lỗi tải feed:", err));
        }

        window.toggleCommentSection = (postId) => {
            const sec = document.getElementById(`comments-${postId}`);
            if (!sec) return;
            if (expandedComments.has(postId)) {
                expandedComments.delete(postId);
                sec.style.display = 'none';
            } else {
                expandedComments.add(postId);
                sec.style.display = 'block';
            }
        };

        window.addComment = async (postId) => {
            if (!currentUserDoc) return;
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            expandedComments.add(postId);

            // Optimistic UI Append for Comments
            const commentsList = document.getElementById(`comments-list-${postId}`);
            if (commentsList) {
                const tempCommentHtml = `
                    <div class="comment-item">
                        <img src="${currentUserDoc.avatar || 'https://ui-avatars.com/api/?name=User'}">
                        <div class="comment-box">
                            <strong style="font-size:0.85rem;">${escapeHtml(currentUserDoc.displayName || currentUserDoc.username)}</strong>
                            <p style="margin-top:2px; font-size:0.9rem;">${escapeHtml(text)}</p>
                        </div>
                    </div>
                `;
                commentsList.insertAdjacentHTML('beforeend', tempCommentHtml);
            }

            try {
                await updateDoc(doc(db, "posts", postId), {
                    comments: arrayUnion({
                        uid: currentUserDoc.uid,
                        name: currentUserDoc.displayName || currentUserDoc.username || 'Người dùng',
                        avatar: currentUserDoc.avatar || `https://ui-avatars.com/api/?name=User`,
                        text: text,
                        createdAt: Date.now()
                    })
                });
            } catch (e) {
                showToast("Lỗi gửi bình luận: " + e.message);
            }
        };

        window.toggleLike = async (postId, isLiked) => {
            if (!currentUserDoc) return;
            const postRef = doc(db, "posts", postId);
            if (isLiked) {
                await updateDoc(postRef, { likes: arrayRemove(currentUserDoc.uid) });
            } else {
                await updateDoc(postRef, { likes: arrayUnion(currentUserDoc.uid) });
            }
        };

        function renderProfilePage() {
            if (!currentUserDoc) return;
            document.getElementById('profile-cover').src = currentUserDoc.cover || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800";
            document.getElementById('profile-avatar').src = currentUserDoc.avatar || "https://ui-avatars.com/api/?name=User";
            document.getElementById('profile-name').innerText = currentUserDoc.displayName || "--";
            document.getElementById('profile-handle').innerText = `@${currentUserDoc.username || "--"}`;
            document.getElementById('profile-bio').innerText = currentUserDoc.bio || "";
            
            document.getElementById('edit-name').value = currentUserDoc.displayName || "";
            document.getElementById('edit-bio').value = currentUserDoc.bio || "";

            if (!currentUserDoc.uid) return;
            const q = query(collection(db, "posts"), where("authorUid", "==", currentUserDoc.uid));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('profile-posts-list');
                if (snap.empty) {
                    list.innerHTML = '<p style="text-align:center; color:gray; padding: 20px;">Chưa có bài viết nào.</p>';
                    return;
                }
                
                let posts = [];
                snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
                
                posts.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return timeB - timeA;
                });

                list.innerHTML = '';
                posts.forEach(p => {
                    list.innerHTML += `<div class="card"><p style="font-weight:600;">${escapeHtml(p.title || 'Bài viết')}</p><p style="margin-top:5px; font-size:0.9rem;">${escapeHtml(p.content || '')}</p></div>`;
                });
            }, (err) => console.error("Profile posts error:", err));
        }

        window.saveProfile = async () => {
            if (!currentUserDoc) return;
            const name = document.getElementById('edit-name').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const avatarFile = document.getElementById('edit-avatar-file').files[0];
            const coverFile = document.getElementById('edit-cover-file').files[0];

            showLoading("Đang nén & lưu thông tin...");
            try {
                let updates = { displayName: name, bio: bio };

                if(avatarFile) {
                    const compressedAvatar = await compressImage(avatarFile, 300, 0.8);
                    updates.avatar = await uploadFileToStorage(compressedAvatar, "avatars");
                }
                if(coverFile) {
                    const compressedCover = await compressImage(coverFile, 1000, 0.75);
                    updates.cover = await uploadFileToStorage(compressedCover, "covers");
                }

                await updateDoc(doc(db, "users", currentUserDoc.uid), updates);
                
                const q = query(collection(db, "posts"), where("authorUid", "==", currentUserDoc.uid));
                const snap = await getDocs(q);
                snap.forEach(d => updateDoc(doc(db, "posts", d.id), { authorName: name, authorAvatar: updates.avatar || currentUserDoc.avatar }));

                document.getElementById('modal-edit-profile').style.display = 'none';
                showToast("Đã cập nhật hồ sơ!");
            } catch (err) {
                showToast("Lỗi lưu hồ sơ: " + err.message);
            }
            hideLoading();
        };

        window.searchUsers = async () => {
            const text = document.getElementById('search-input').value.toLowerCase().trim();
            try {
                const q = query(collection(db, "users"));
                const snap = await getDocs(q);
                
                const list = document.getElementById('search-results');
                list.innerHTML = '';
                
                snap.forEach(d => {
                    const u = d.data();
                    if(currentUserDoc && u.uid !== currentUserDoc.uid && (!text || u.username?.toLowerCase().includes(text) || u.displayName?.toLowerCase().includes(text))) {
                        usersCache[u.uid] = u;
                        list.innerHTML += `
                            <div class="card" style="text-align:center; padding: 15px 10px;">
                                <img src="${u.avatar || 'https://ui-avatars.com/api/?name=User'}" class="avatar-sm" style="width:60px; height:60px; margin:0 auto 10px;" loading="lazy">
                                <strong style="display:block; font-size:0.9rem;">${escapeHtml(u.displayName || 'User')}</strong>
                                <p style="font-size:0.75rem; color:gray; margin-bottom:10px;">@${escapeHtml(u.username || 'user')}</p>
                                <button onclick="openChatById('${u.uid}')" style="width:100%; font-size:0.8rem;"><i class="fa-solid fa-message"></i> Nhắn tin</button>
                            </div>
                        `;
                    }
                });
            } catch(err) {
                console.error("Search error:", err);
            }
        };

        function listenChatUsers() {
            const q = query(collection(db, "users"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('chat-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const u = d.data();
                    if(currentUserDoc && u.uid !== currentUserDoc.uid) {
                        usersCache[u.uid] = u;
                        list.innerHTML += `
                            <div class="chat-user-item" onclick="openChatById('${u.uid}')">
                                <img src="${u.avatar || 'https://ui-avatars.com/api/?name=User'}" class="avatar-sm" loading="lazy">
                                <div>
                                    <strong style="font-size:0.95rem;">${escapeHtml(u.displayName || 'User')}</strong>
                                    <p style="font-size:0.75rem; color:var(--text-secondary);">@${escapeHtml(u.username || 'user')}</p>
                                </div>
                            </div>
                        `;
                    }
                });
            }, (err) => console.error("Chat list error:", err));
        }

        let unsubscribeChat = null;

        window.openChatById = (uid) => {
            const u = usersCache[uid];
            if (u) {
                openChat(u.uid, u.displayName || u.username, u.avatar);
            }
        };

        window.openChat = (uid, name, avatar) => {
            if (!currentUserDoc) return;
            activeChatUserId = uid;

            switchPage('messages', null);

            document.getElementById('chat-list').style.display = 'none';
            document.getElementById('chat-room').style.display = 'flex';
            document.getElementById('chat-active-avatar').src = avatar || 'https://ui-avatars.com/api/?name=User';
            document.getElementById('chat-active-name').innerText = name || 'User';
            
            const chatId = currentUserDoc.uid < uid ? `${currentUserDoc.uid}_${uid}` : `${uid}_${currentUserDoc.uid}`;
            
            if(unsubscribeChat) unsubscribeChat();
            const q = query(collection(db, "messages"), where("chatId", "==", chatId));
            
            unsubscribeChat = onSnapshot(q, (snap) => {
                const box = document.getElementById('chat-messages-box');
                
                let msgs = [];
                snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                
                msgs.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return timeA - timeB;
                });

                box.innerHTML = '';
                msgs.forEach(m => {
                    const isMe = m.senderId === currentUserDoc.uid;
                    let mediaHtml = '';
                    if(m.mediaUrl) {
                        mediaHtml = m.mediaType === 'video' 
                            ? `<video src="${m.mediaUrl}" controls style="width:100%; border-radius:8px; margin-top:5px;"></video>` 
                            : `<img src="${m.mediaUrl}" loading="lazy" style="width:100%; border-radius:8px; margin-top:5px;">`;
                    }
                    box.innerHTML += `
                        <div class="msg-bubble ${isMe ? 'sent' : 'received'}">
                            ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
                            ${mediaHtml}
                        </div>
                    `;
                });
                setTimeout(() => { box.scrollTop = box.scrollHeight; }, 30);
            }, (err) => console.error("Message room error:", err));
        };

        window.closeChatRoom = () => {
            document.getElementById('chat-room').style.display = 'none';
            document.getElementById('chat-list').style.display = 'block';
            activeChatUserId = null;
            if(unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
        };

        window.sendChatText = async () => {
            if (!currentUserDoc || !activeChatUserId) return;
            const input = document.getElementById('chat-text');
            const text = input.value.trim();
            if(!text) return;

            const chatId = currentUserDoc.uid < activeChatUserId ? `${currentUserDoc.uid}_${activeChatUserId}` : `${activeChatUserId}_${currentUserDoc.uid}`;
            input.value = '';

            // Optimistic Instant UI Append
            const box = document.getElementById('chat-messages-box');
            const tempBubble = document.createElement('div');
            tempBubble.className = 'msg-bubble sent sending';
            tempBubble.innerHTML = `<div>${escapeHtml(text)}</div>`;
            box.appendChild(tempBubble);
            box.scrollTop = box.scrollHeight;

            try {
                await addDoc(collection(db, "messages"), {
                    chatId: chatId, 
                    senderId: currentUserDoc.uid, 
                    receiverId: activeChatUserId,
                    text: text, 
                    mediaUrl: "", 
                    mediaType: "text", 
                    createdAt: serverTimestamp()
                });
            } catch(e) {
                tempBubble.style.background = '#aa0000';
                showToast("Không thể gửi: " + e.message);
            }
        };

        window.sendChatFile = async (inputEl) => {
            if (!currentUserDoc || !activeChatUserId) return;
            const file = inputEl.files[0];
            if(!file) return;
            
            showLoading("Đang nén & gửi tập tin...");
            try {
                let uploadFile = file;
                if(file.type.startsWith('image/')) {
                    uploadFile = await compressImage(file, 800, 0.7);
                }
                const mediaUrl = await uploadFileToStorage(uploadFile, "chatMedia");
                const mediaType = file.type.startsWith('video/') ? 'video' : 'image';
                const chatId = currentUserDoc.uid < activeChatUserId ? `${currentUserDoc.uid}_${activeChatUserId}` : `${activeChatUserId}_${currentUserDoc.uid}`;
                
                await addDoc(collection(db, "messages"), {
                    chatId: chatId, 
                    senderId: currentUserDoc.uid, 
                    receiverId: activeChatUserId,
                    text: "", 
                    mediaUrl: mediaUrl, 
                    mediaType: mediaType, 
                    createdAt: serverTimestamp()
                });
            } catch(e) { 
                showToast("Lỗi gửi tập tin: " + e.message); 
            }
            inputEl.value = '';
            hideLoading();
        };
    </script>
</body>
</html>
