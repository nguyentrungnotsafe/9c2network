<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9c2network.io.vn - Monochromatic Social Network</title>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Giữ nguyên cấu trúc Firebase nếu bạn tích hợp sau này -->
    <!-- <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js"></script> -->

    <style>
        /* === BẢNG MÀU VÀ NỀN CHỦ ĐỀ ĐEN TRẮNG (MONOCHROME) === */
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --bg-input: #1f1f1f;
            --border-color: #333333;
            --border-focus: #ffffff;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #666666;
            --accent-white: #ffffff;
            --accent-black: #000000;
            --danger: #ff4d4d;
            --success: #2ea44f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Common Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* Buttons & Inputs */
        button {
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--accent-black);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-white);
            color: var(--accent-black);
            border-color: var(--accent-white);
        }

        input, textarea, select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }

        input:focus, textarea:focus { border-color: var(--border-focus); }

        /* === GIAO DIỆN ĐĂNG NHẬP / ĐĂNG KÝ === */
        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            padding: 15px;
        }

        .auth-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px 20px;
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            text-align: center;
        }

        .auth-box h1 { font-size: 1.8rem; letter-spacing: 1px; margin-bottom: 8px; }
        .auth-box p.subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 25px; }

        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .auth-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--text-secondary); }
        .auth-tab.active { color: var(--text-primary); border-bottom: 2px solid var(--text-primary); }

        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        .auth-form button { padding: 12px; margin-top: 10px; }

        /* === GIAO DIỆN CHÍNH (MAIN APP) === */
        #app-container { display: none; flex-direction: column; min-height: 100vh; }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 15px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }

        .nav-menu { display: flex; gap: 10px; flex: 1; justify-content: center; }
        .nav-item {
            background: none; border: none; color: var(--text-secondary); font-size: 0.95rem; padding: 8px 12px; display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center;
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-white); background: var(--bg-input); border-color: var(--border-color); }

        .user-nav { display: flex; align-items: center; gap: 10px; }
        .avatar-small { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-color); object-fit: cover; }

        .main-layout {
            max-width: 1200px; margin: 15px auto; width: 100%; display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 0 15px; flex: 1;
        }

        /* Sidebar bên trái */
        .sidebar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; height: fit-content; }
        .mini-profile { text-align: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        .mini-profile img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; object-fit: cover; }
        .sidebar-btn { text-align: left; width: 100%; background: transparent; border: none; color: var(--text-secondary); display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 5px; }

        /* Khu vực Nội dung chính */
        .content-area { display: flex; flex-direction: column; gap: 15px; width: 100%; overflow: hidden; }

        /* BOX ĐĂNG BÀI & POSTS */
        .create-post-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .create-post-inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; margin-top: 10px; }
        .post-type-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .post-type-btn { font-size: 0.8rem; padding: 6px 10px; }
        .post-type-btn.selected { background: var(--accent-white); color: var(--accent-black); }

        .post-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .post-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .post-author { display: flex; align-items: center; gap: 10px; }
        .post-author-img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .post-title { font-size: 1.1rem; font-weight: 700; }
        .post-text { color: var(--text-secondary); line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        
        .post-media { width: 100%; border: 1px solid var(--border-color); border-radius: 4px; background: #000; display: flex; align-items: center; justify-content: center; }
        .post-media img, .post-media video { width: 100%; max-height: 400px; object-fit: contain; }

        .post-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 12px; flex-wrap: wrap; gap: 5px; }
        .action-btn { background: transparent; border: none; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; font-size: 0.85rem; padding: 5px; flex: 1; justify-content: center; }
        .action-btn.liked { color: var(--accent-white); font-weight: bold; }

        .comments-section { border-top: 1px dashed var(--border-color); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: var(--bg-input); padding: 8px 10px; border-radius: 4px; font-size: 0.85rem; }
        .comment-input-box { display: flex; gap: 8px; }

        /* TRANG CÁ NHÂN */
        .profile-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .cover-photo-container { height: 140px; background: #222; }
        .cover-photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .profile-details { padding: 15px; position: relative; display: flex; flex-direction: column; gap: 10px; }
        .avatar-container { position: absolute; top: -45px; left: 15px; }
        .avatar-container img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--bg-card); object-fit: cover; background: var(--bg-main); }
        .profile-header-actions { display: flex; justify-content: flex-end; }
        .profile-info { margin-top: 35px; }
        
        /* KHU VỰC TÌM KIẾM */
        .search-box-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; }
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .user-card { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .user-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .user-card button { font-size: 0.8rem; padding: 6px; width: 100%; }

        /* KHU VỰC TIN NHẮN (TỐI ƯU MOBILE) */
        .chat-container { display: grid; grid-template-columns: 260px 1fr; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; height: calc(100vh - 180px); min-height: 400px; overflow: hidden; }
        .chat-list { border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
        .chat-user-item { padding: 12px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .chat-user-item:hover, .chat-user-item.active { background: var(--bg-input); }
        .chat-user-item img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .chat-main { display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
        .chat-header { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); }
        .chat-header-user { display: flex; align-items: center; gap: 8px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0d0d0d; }
        .msg-bubble { max-width: 80%; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; word-break: break-word; }
        .msg-bubble.sent { align-self: flex-end; background: var(--accent-white); color: var(--accent-black); }
        .msg-bubble.received { align-self: flex-start; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-color); }
        .chat-input-bar { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; background: var(--bg-card); }
        .chat-input-bar input { flex: 1; }

        /* Mobile Back Button cho Chat */
        #mobile-back-chat { display: none; background: transparent; border: none; color: var(--text-primary); font-size: 1.2rem; margin-right: 5px; padding: 0 10px; }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .call-modal { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 500px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .video-streams { position: relative; width: 100%; height: 250px; background: #000; border-radius: 6px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .video-streams video { width: 100%; height: 100%; object-fit: cover; }
        .call-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }

        /* ================= TỐI ƯU MOBILE (MEDIA QUERIES) ================= */
        @media (max-width: 768px) {
            /* Header & Bottom Nav Style */
            header { padding: 10px; }
            .header-content { flex-direction: row; justify-content: space-between; }
            .nav-menu { 
                position: fixed; bottom: 0; left: 0; width: 100%; 
                background: var(--bg-card); border-top: 1px solid var(--border-color); 
                padding: 10px; z-index: 999; margin: 0; 
            }
            .nav-item { flex-direction: column; font-size: 0.75rem; gap: 4px; padding: 4px; }
            .nav-item i { font-size: 1.2rem; }
            
            /* Layout */
            .main-layout { grid-template-columns: 1fr; margin-top: 10px; padding-bottom: 70px; } /* padding bottom for fixed nav */
            .sidebar { display: none; } /* Ẩn sidebar trên mobile, tính năng đã có trong Nav/Header */
            
            /* Post Box */
            .create-post-card { padding: 12px; }
            .create-post-inputs { margin-bottom: 10px; }
            
            /* Chat Box Mobile Logic */
            .chat-container { grid-template-columns: 1fr; height: calc(100vh - 160px); border: none; background: transparent; }
            .chat-list { display: flex; border-right: none; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); }
            .chat-main { display: none; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); }
            
            /* Khi chọn 1 chat, ẩn List, hiện Main */
            .chat-container.chat-active .chat-list { display: none; }
            .chat-container.chat-active .chat-main { display: flex; }
            #mobile-back-chat { display: block; }
            .chat-header-actions button { padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h1>9C2NETWORK</h1>
            <p class="subtitle">Mạng xã hội tối giản Đen & Trắng</p>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Đăng nhập</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Đăng ký</button>
            </div>
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <input type="text" id="login-username" placeholder="Tên người dùng" required>
                <input type="password" id="login-password" placeholder="Mật khẩu" required>
                <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button>
            </form>
            <form id="register-form" class="auth-form" style="display: none;" onsubmit="handleRegister(event)">
                <input type="text" id="reg-fullname" placeholder="Họ và Tên" required>
                <input type="text" id="reg-username" placeholder="Tên người dùng" required>
                <input type="password" id="reg-password" placeholder="Mật khẩu" required>
                <button type="submit"><i class="fa-solid fa-user-plus"></i> Tạo Tài Khoản</button>
            </form>
        </div>
    </div>

    <div id="app-container">
        <header>
            <div class="header-content">
                <a href="#" class="logo" onclick="switchTab('feed')"><i class="fa-solid fa-globe"></i> 9c2network</a>
                <div class="user-nav">
                    <img id="nav-user-avatar" src="" class="avatar-small" alt="Avatar" onclick="switchTab('profile')">
                    <button onclick="handleLogout()" title="Đăng xuất" style="padding: 6px 10px;"><i class="fa-solid fa-power-off"></i></button>
                </div>
                <nav class="nav-menu">
                    <button class="nav-item active" id="nav-feed" onclick="switchTab('feed')"><i class="fa-solid fa-house"></i> Bảng tin</button>
                    <button class="nav-item" id="nav-friends" onclick="switchTab('friends')"><i class="fa-solid fa-user-group"></i> Kết bạn</button>
                    <button class="nav-item" id="nav-messages" onclick="switchTab('messages')"><i class="fa-solid fa-message"></i> Tin nhắn</button>
                    <!-- Nav bổ sung cho mobile thay thế sidebar -->
                    <button class="nav-item mobile-only-nav" id="nav-profile" onclick="switchTab('profile')" style="display: none;"><i class="fa-solid fa-user"></i> Hồ sơ</button>
                </nav>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="mini-profile">
                    <img id="side-user-avatar" src="" alt="Avatar">
                    <h3 id="side-user-name">--</h3>
                    <p id="side-user-handle" style="font-size:0.85rem; color:var(--text-muted);">@--</p>
                </div>
                <div class="sidebar-menu">
                    <button class="sidebar-btn" onclick="switchTab('profile')"><i class="fa-solid fa-id-card"></i> Trang cá nhân</button>
                    <button class="sidebar-btn" onclick="switchTab('feed')"><i class="fa-solid fa-rss"></i> Bài đăng</button>
                    <button class="sidebar-btn" onclick="switchTab('friends')"><i class="fa-solid fa-magnifying-glass"></i> Tìm bạn</button>
                </div>
            </aside>

            <main class="content-area">
                <div id="tab-feed" class="tab-content">
                    <div class="create-post-card">
                        <h3 style="font-size: 0.95rem; margin-bottom: 8px;"><i class="fa-solid fa-pen-to-square"></i> Đăng bài viết</h3>
                        <div class="create-post-inputs">
                            <input type="text" id="post-title-input" placeholder="Tiêu đề...">
                            <textarea id="post-content-input" placeholder="Bạn đang nghĩ gì?" rows="2"></textarea>
                            <input type="text" id="post-media-input" placeholder="URL Hình/Video (Tùy chọn)...">
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                            <div class="post-type-options">
                                <button class="post-type-btn selected" id="btn-type-standard" onclick="setPostType('standard')">Bài viết</button>
                                <button class="post-type-btn" id="btn-type-live" onclick="setPostType('livestream')">🔴 Live</button>
                            </div>
                            <button onclick="submitNewPost()"><i class="fa-solid fa-paper-plane"></i> Đăng</button>
                        </div>
                    </div>
                    <div id="posts-container" style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px;"></div>
                </div>

                <div id="tab-profile" class="tab-content" style="display: none;">
                    <div class="profile-card">
                        <div class="cover-photo-container"><img id="profile-cover-img" src=""></div>
                        <div class="profile-details">
                            <div class="avatar-container"><img id="profile-avatar-img" src=""></div>
                            <div class="profile-header-actions">
                                <button onclick="openEditProfileModal()" style="font-size: 0.85rem;"><i class="fa-solid fa-pen"></i> Sửa</button>
                            </div>
                            <div class="profile-info">
                                <h2 id="profile-display-name" style="font-size: 1.3rem;">--</h2>
                                <p id="profile-display-handle" style="color:var(--text-muted); font-size:0.85rem;">@--</p>
                                <p id="profile-display-bio" style="margin-top:8px; font-size:0.9rem; color:var(--text-secondary);">--</p>
                            </div>
                        </div>
                    </div>
                    <h3 style="margin-top: 20px; margin-bottom: 10px; font-size: 1rem;"><i class="fa-solid fa-clock-rotate-left"></i> Bài đăng của bạn</h3>
                    <div id="user-posts-container" style="display: flex; flex-direction: column; gap: 15px;"></div>
                </div>

                <div id="tab-friends" class="tab-content" style="display: none;">
                    <div class="search-box-card">
                        <h3 style="font-size:1rem;"><i class="fa-solid fa-user-plus"></i> Tìm kiếm</h3>
                        <input type="text" id="search-username-input" placeholder="Nhập tên..." style="margin-top: 10px;" oninput="renderUserSearch()">
                    </div>
                    <div class="user-grid" id="user-search-results"></div>
                </div>

                <div id="tab-messages" class="tab-content" style="display: none;">
                    <div class="chat-container" id="chat-wrapper">
                        <div class="chat-list" id="chat-users-list"></div>
                        
                        <div class="chat-main">
                            <div class="chat-header">
                                <div class="chat-header-user">
                                    <button id="mobile-back-chat" onclick="hideActiveChat()"><i class="fa-solid fa-chevron-left"></i></button>
                                    <img id="chat-active-avatar" src="https://via.placeholder.com/40" class="avatar-small">
                                    <div>
                                        <strong id="chat-active-name" style="font-size:0.95rem;">Chọn người chat</strong>
                                        <p id="chat-active-status" style="font-size: 0.75rem; color: var(--text-muted);"></p>
                                    </div>
                                </div>
                                <div class="chat-header-actions" id="chat-call-actions" style="display: none;">
                                    <button onclick="startCall('voice')"><i class="fa-solid fa-phone"></i></button>
                                    <button onclick="startCall('video')"><i class="fa-solid fa-video"></i></button>
                                </div>
                            </div>
                            <div class="chat-messages" id="chat-messages-body">
                                <div style="text-align: center; color: var(--text-muted); margin-top: 50px; font-size:0.9rem;">Chọn bạn bè để nhắn tin.</div>
                            </div>
                            <div class="chat-input-bar">
                                <button onclick="sendAttachment('image')" style="padding: 8px;"><i class="fa-solid fa-image"></i></button>
                                <input type="text" id="chat-text-input" placeholder="Nhập tin nhắn..." onkeypress="handleChatKeyPress(event)">
                                <button onclick="sendChatMessage()" style="padding: 8px 12px;"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-edit-profile" class="modal-overlay">
        <div class="call-modal">
            <h3 style="font-size:1.2rem;">Sửa Trang Cá Nhân</h3>
            <div style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
                <label style="font-size:0.85rem;">Tên hiển thị:</label><input type="text" id="edit-name-input">
                <label style="font-size:0.85rem;">URL Avatar:</label><input type="text" id="edit-avatar-input">
                <label style="font-size:0.85rem;">URL Cover:</label><input type="text" id="edit-cover-input">
                <label style="font-size:0.85rem;">Tiểu sử:</label><textarea id="edit-bio-input" rows="3"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button onclick="closeEditProfileModal()">Hủy</button>
                <button onclick="saveProfileChanges()">Lưu</button>
            </div>
        </div>
    </div>

    <div id="modal-call" class="modal-overlay">
        <div class="call-modal">
            <h3 id="call-title" style="font-size:1.1rem;">Đang gọi...</h3>
            <div class="video-streams">
                <video id="local-video" autoplay playsinline muted></video>
                <div id="voice-avatar-placeholder" style="display:none; position:absolute; flex-direction:column; align-items:center;">
                    <img id="call-user-avatar" src="" style="width: 80px; height:80px; border-radius:50%; border:2px solid #fff;">
                    <p id="call-user-name" style="margin-top:10px; font-size:1rem;"></p>
                </div>
            </div>
            <div class="call-controls">
                <button id="btn-toggle-mic" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i></button>
                <button id="btn-toggle-cam" onclick="toggleCam()"><i class="fa-solid fa-video"></i></button>
                <button class="btn-danger" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i> Tắt</button>
            </div>
        </div>
    </div>

    <script>
        // Data Khởi tạo
        const DEFAULT_USERS = [{ username: "Trung6011", password: "Trung143@", fullname: "Nguyễn Trung", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150", cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1000", bio: "Founder tại 9c2network.io.vn", friends: ["admin_system"] }, { username: "admin_system", password: "123", fullname: "Hệ Thống 9c2", avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150", cover: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1000", bio: "Hỗ trợ tự động.", friends: ["Trung6011"] }];
        const DEFAULT_POSTS = [{ id: "p1", username: "Trung6011", title: "Chào mừng bạn đến với 9c2network", content: "Mạng xã hội Monochromatic. Hỗ trợ responsive mobile hoàn chỉnh!", media: "", type: "standard", timestamp: "Vừa xong", likes: ["admin_system"], comments: [], shares: 0 }];

        let users = JSON.parse(localStorage.getItem("9c2_users")) || DEFAULT_USERS;
        let posts = JSON.parse(localStorage.getItem("9c2_posts")) || DEFAULT_POSTS;
        let messages = JSON.parse(localStorage.getItem("9c2_messages")) || [];
        let currentUser = JSON.parse(localStorage.getItem("9c2_current_user")) || null;
        let activeChatUser = null; let currentPostType = 'standard'; let localStream = null;

        function saveData() {
            localStorage.setItem("9c2_users", JSON.stringify(users));
            localStorage.setItem("9c2_posts", JSON.stringify(posts));
            localStorage.setItem("9c2_messages", JSON.stringify(messages));
            if(currentUser) localStorage.setItem("9c2_current_user", JSON.stringify(currentUser)); else localStorage.removeItem("9c2_current_user");
        }

        window.onload = function() {
            if (window.innerWidth <= 768) document.getElementById('nav-profile').style.display = 'flex';
            if (currentUser) { const found = users.find(u => u.username === currentUser.username); if(found) currentUser = found; showMainApp(); }
            else { document.getElementById("auth-container").style.display = "flex"; }
        };

        function switchAuthTab(tab) {
            document.querySelectorAll(".auth-tab").forEach(b => b.classList.remove("active"));
            if(tab === 'login') { document.querySelectorAll(".auth-tab")[0].classList.add("active"); document.getElementById("login-form").style.display = "flex"; document.getElementById("register-form").style.display = "none"; }
            else { document.querySelectorAll(".auth-tab")[1].classList.add("active"); document.getElementById("login-form").style.display = "none"; document.getElementById("register-form").style.display = "flex"; }
        }

        function handleLogin(e) {
            e.preventDefault(); const uInput = document.getElementById("login-username").value.trim(); const pInput = document.getElementById("login-password").value.trim();
            const found = users.find(u => u.username === uInput && u.password === pInput);
            if(found) { currentUser = found; saveData(); showMainApp(); } else alert("Sai tài khoản/mật khẩu!");
        }

        function handleRegister(e) {
            e.preventDefault(); const name = document.getElementById("reg-fullname").value.trim(); const uname = document.getElementById("reg-username").value.trim(); const pass = document.getElementById("reg-password").value.trim();
            if(users.some(u => u.username === uname)) return alert("Tên đăng nhập đã tồn tại!");
            const newUser = { username: uname, password: pass, fullname: name, avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150", cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1000", bio: "Thành viên mới", friends: [] };
            users.push(newUser); currentUser = newUser; saveData(); showMainApp();
        }

        function handleLogout() { if(confirm("Đăng xuất?")) { currentUser = null; saveData(); location.reload(); } }

        function showMainApp() {
            document.getElementById("auth-container").style.display = "none"; document.getElementById("app-container").style.display = "flex";
            document.getElementById("nav-user-avatar").src = currentUser.avatar; document.getElementById("side-user-avatar").src = currentUser.avatar;
            document.getElementById("side-user-name").innerText = currentUser.fullname; document.getElementById("side-user-handle").innerText = "@" + currentUser.username;
            renderProfileTab(); renderPosts(); renderUserSearch(); renderChatUserList();
        }

        function switchTab(tabName) {
            document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
            document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
            document.getElementById(`tab-${tabName}`).style.display = "block";
            const navBtn = document.getElementById(`nav-${tabName}`); if(navBtn) navBtn.classList.add("active");
            if(tabName === 'profile') renderProfileTab(); if(tabName === 'friends') renderUserSearch(); if(tabName === 'messages') { renderChatUserList(); hideActiveChat(); }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Post Logic
        function setPostType(type) { currentPostType = type; document.getElementById("btn-type-standard").classList.toggle("selected", type === 'standard'); document.getElementById("btn-type-live").classList.toggle("selected", type === 'livestream'); }
        function submitNewPost() {
            const title = document.getElementById("post-title-input").value.trim(); const content = document.getElementById("post-content-input").value.trim(); const media = document.getElementById("post-media-input").value.trim();
            if(!title && !content) return alert("Nhập nội dung!");
            posts.unshift({ id: "p_" + Date.now(), username: currentUser.username, title, content, media, type: currentPostType, timestamp: "Vừa xong", likes: [], comments: [], shares: 0 });
            saveData(); document.getElementById("post-title-input").value = ""; document.getElementById("post-content-input").value = ""; document.getElementById("post-media-input").value = ""; renderPosts(); renderProfileTab();
        }
        function renderPosts() {
            const container = document.getElementById("posts-container"); container.innerHTML = "";
            posts.forEach(post => {
                const author = users.find(u => u.username === post.username) || { fullname: post.username, avatar: "https://via.placeholder.com/40" };
                const isLiked = post.likes.includes(currentUser.username);
                container.innerHTML += `
                    <div class="post-card">
                        <div class="post-header"><div class="post-author"><img src="${author.avatar}" class="post-author-img"><div><strong style="font-size:0.95rem;">${author.fullname}</strong><p style="font-size:0.75rem;color:var(--text-muted);">@${post.username} • ${post.timestamp}</p></div></div></div>
                        ${post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : ''}
                        ${post.content ? `<div class="post-text">${escapeHtml(post.content)}</div>` : ''}
                        ${post.media ? `<div class="post-media"><img src="${post.media}"></div>` : ''}
                        <div class="post-actions">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')"><i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart"></i> ${post.likes.length}</button>
                            <button class="action-btn"><i class="fa-regular fa-comment"></i> ${post.comments.length}</button>
                        </div>
                    </div>`;
            });
        }
        function toggleLike(id) { const post = posts.find(p => p.id === id); if(!post) return; const idx = post.likes.indexOf(currentUser.username); if(idx > -1) post.likes.splice(idx, 1); else post.likes.push(currentUser.username); saveData(); renderPosts(); }

        // Profile Logic
        function renderProfileTab() {
            document.getElementById("profile-cover-img").src = currentUser.cover; document.getElementById("profile-avatar-img").src = currentUser.avatar;
            document.getElementById("profile-display-name").innerText = currentUser.fullname; document.getElementById("profile-display-handle").innerText = "@" + currentUser.username; document.getElementById("profile-display-bio").innerText = currentUser.bio || "Chưa có tiểu sử.";
            const userPostsContainer = document.getElementById("user-posts-container"); userPostsContainer.innerHTML = "";
            posts.filter(p => p.username === currentUser.username).forEach(post => {
                userPostsContainer.innerHTML += `<div class="post-card"><strong style="font-size:0.95rem">${post.title || 'Bài viết'}</strong><p style="font-size:0.85rem">${escapeHtml(post.content)}</p></div>`;
            });
        }
        function openEditProfileModal() { document.getElementById("edit-name-input").value = currentUser.fullname; document.getElementById("edit-avatar-input").value = currentUser.avatar; document.getElementById("edit-cover-input").value = currentUser.cover; document.getElementById("edit-bio-input").value = currentUser.bio || ""; document.getElementById("modal-edit-profile").style.display = "flex"; }
        function closeEditProfileModal() { document.getElementById("modal-edit-profile").style.display = "none"; }
        function saveProfileChanges() {
            currentUser.fullname = document.getElementById("edit-name-input").value.trim() || currentUser.fullname; currentUser.avatar = document.getElementById("edit-avatar-input").value.trim() || currentUser.avatar; currentUser.cover = document.getElementById("edit-cover-input").value.trim() || currentUser.cover; currentUser.bio = document.getElementById("edit-bio-input").value.trim();
            const idx = users.findIndex(u => u.username === currentUser.username); if(idx > -1) users[idx] = currentUser; saveData(); closeEditProfileModal(); showMainApp();
        }

        // Friends Logic
        function renderUserSearch() {
            const query = document.getElementById("search-username-input").value.toLowerCase(); const container = document.getElementById("user-search-results"); container.innerHTML = "";
            users.filter(u => u.username !== currentUser.username && (u.username.toLowerCase().includes(query) || u.fullname.toLowerCase().includes(query))).forEach(user => {
                const isFriend = currentUser.friends.includes(user.username);
                container.innerHTML += `<div class="user-card"><img src="${user.avatar}"><strong style="font-size:0.9rem">${user.fullname}</strong><button onclick="toggleFriend('${user.username}')">${isFriend ? 'Hủy bạn' : 'Kết bạn'}</button></div>`;
            });
        }
        function toggleFriend(u) { const idx = currentUser.friends.indexOf(u); if(idx > -1) currentUser.friends.splice(idx, 1); else currentUser.friends.push(u); const userIdx = users.findIndex(user => user.username === currentUser.username); if(userIdx > -1) users[userIdx] = currentUser; saveData(); renderUserSearch(); renderChatUserList(); }

        // Chat Logic
        function renderChatUserList() {
            const container = document.getElementById("chat-users-list"); container.innerHTML = "";
            users.filter(u => u.username !== currentUser.username).forEach(u => {
                const div = document.createElement("div"); div.className = `chat-user-item ${activeChatUser?.username === u.username ? 'active' : ''}`; div.onclick = () => selectChatUser(u);
                div.innerHTML = `<img src="${u.avatar}"><div><strong style="font-size:0.9rem">${u.fullname}</strong><p style="font-size:0.75rem; color:var(--text-muted);">@${u.username}</p></div>`; container.appendChild(div);
            });
        }
        function selectChatUser(user) {
            activeChatUser = user; document.getElementById("chat-active-avatar").src = user.avatar; document.getElementById("chat-active-name").innerText = user.fullname; document.getElementById("chat-active-status").innerText = "@" + user.username; document.getElementById("chat-call-actions").style.display = "flex";
            document.getElementById("chat-wrapper").classList.add("chat-active"); // Kích hoạt giao diện Mobile Chat Main
            renderChatUserList(); renderMessages();
        }
        function hideActiveChat() { document.getElementById("chat-wrapper").classList.remove("chat-active"); activeChatUser = null; renderChatUserList(); }
        function renderMessages() {
            if(!activeChatUser) return; const body = document.getElementById("chat-messages-body"); body.innerHTML = "";
            messages.filter(m => (m.from === currentUser.username && m.to === activeChatUser.username) || (m.from === activeChatUser.username && m.to === currentUser.username)).forEach(m => {
                body.innerHTML += `<div class="msg-bubble ${m.from === currentUser.username ? 'sent' : 'received'}">${escapeHtml(m.text || '')} ${m.mediaUrl ? `<br><img src="${m.mediaUrl}" style="max-width:100%; border-radius:4px; margin-top:5px;">` : ''}</div>`;
            });
            body.scrollTop = body.scrollHeight;
        }
        function sendChatMessage(type = 'text', mediaUrl = '') {
            if(!activeChatUser) return; const input = document.getElementById("chat-text-input"); const text = input.value.trim(); if(!text && !mediaUrl) return;
            messages.push({ from: currentUser.username, to: activeChatUser.username, text, mediaType: type, mediaUrl, timestamp: Date.now() }); saveData(); input.value = ""; renderMessages();
        }
        function handleChatKeyPress(e) { if(e.key === 'Enter') sendChatMessage(); }
        function sendAttachment(type) { const url = prompt(`Nhập URL Hình ảnh:`); if(url) sendChatMessage(type, url); }

        // Calling Logic
        async function startCall(type) {
            if(!activeChatUser) return; document.getElementById("call-title").innerText = `${type === 'video' ? 'Video Call' : 'Voice Call'} với ${activeChatUser.fullname}`; document.getElementById("modal-call").style.display = "flex";
            if(type === 'voice') { document.getElementById("voice-avatar-placeholder").style.display = "flex"; document.getElementById("call-user-avatar").src = activeChatUser.avatar; } else document.getElementById("voice-avatar-placeholder").style.display = "none";
            try { localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true }); document.getElementById("local-video").srcObject = localStream; } catch (e) { console.log(e); }
        }
        function endCall() { if(localStream) localStream.getTracks().forEach(t => t.stop()); document.getElementById("modal-call").style.display = "none"; }
        function toggleMic() { if(localStream) { const track = localStream.getAudioTracks()[0]; if(track) track.enabled = !track.enabled; } }
        function toggleCam() { if(localStream) { const track = localStream.getVideoTracks()[0]; if(track) track.enabled = !track.enabled; } }
        
        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    </script>
</body>
</html>
